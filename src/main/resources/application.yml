spring:
  application:
    name: L09ClientMCP
  
  # AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      # Model configuration - you can change this to test different models
      chat:
        options:
          model: gpt-4o-mini  # Alternative: gpt-4o, gpt-4o-mini, gpt-3.5-turbo
          temperature: 0.7
          max-tokens: 1000
    
    # MCP Configuration (Model Context Protocol)
    mcp:
      client:
        enabled: true
        request-timeout: 30s
        type: SYNC  # Use synchronous client for SSE transport
        sse:
          connections:
            echo-server:
              url: "http://localhost:3000/sse"
              enabled: true
              health-check-interval: 30s
              max-retries: 3
              retry-delay: 5s
            brave-search:
              url: "http://localhost:3001/sse"
              enabled: true
              health-check-interval: 30s
              max-retries: 3
              retry-delay: 5s
      
      # Multi-Server Configuration (Branch 9)
      multi-server:
        enabled: true
        load-balancing-strategy: ROUND_ROBIN  # ROUND_ROBIN, WEIGHTED, RANDOM, LEAST_CONNECTIONS
        health-check-interval: 30s
        circuit-breaker:
          failure-threshold: 5
          timeout: 60s
          half-open-retry-delay: 30s
          failure-rate-threshold: 0.5
          half-open-max-calls: 3
        servers:
          mock-server-1:
            url: "mock://server1"
            type: MOCK
            tools: ["echo", "ping"]
            weight: 1
            enabled: true
            connection-timeout: 10s
            description: "Primary mock server for testing"
          mock-server-2:
            url: "mock://server2"
            type: MOCK
            tools: ["echo", "ping"]
            weight: 1
            enabled: true
            connection-timeout: 10s
            description: "Secondary mock server for testing"
          brave-search-server:
            url: "http://localhost:3001/sse"
            type: SSE
            tools: ["brave_web_search", "brave_news_search", "brave_image_search", "brave_video_search"]
            weight: 2
            enabled: true
            connection-timeout: 30s
            description: "Brave Search MCP server"
          weather-server:
            url: "http://localhost:3002/sse"
            type: SSE
            tools: ["get_weather", "get_forecast", "weather_alerts"]
            weight: 1
            enabled: false
            connection-timeout: 15s
            description: "Weather information server"
          calculator-server:
            url: "mock://calculator"
            type: MOCK
            tools: ["calculate", "convert_units", "math_operations"]
            weight: 1
            enabled: false
            connection-timeout: 5s
            description: "Mathematical calculations server"
          # Claude Desktop MCP Servers
          applescript-server:
            url: "stdio://applescript"
            type: STDIO
            tools: ["run_applescript", "get_system_info", "show_notification"]
            weight: 2
            enabled: true
            connection-timeout: 30s
            description: "AppleScript execution server from Claude Desktop"
            metadata:
              command: "npx"
              args: ["@peakmojo/applescript-mcp"]
              env:
                NODE_ENV: "production"
          filesystem-server:
            url: "stdio://filesystem"
            type: STDIO
            tools: ["read_file", "write_file", "list_directory", "create_directory"]
            weight: 1
            enabled: true
            connection-timeout: 30s
            description: "Filesystem access server from Claude Desktop"
            metadata:
              command: "npx"
              args: ["-y", "@modelcontextprotocol/server-filesystem", "/Users/igorwaraxe/Desktop", "/Users/igorwaraxe/Downloads"]
          browser-server:
            url: "stdio://browser"
            type: STDIO
            tools: ["browse_website", "take_screenshot", "extract_content"]
            weight: 1
            enabled: false
            connection-timeout: 45s
            description: "Browser automation server from Claude Desktop"
            metadata:
              command: "npx"
              args: ["@browsermcp/mcp@latest"]

# Brave Search API Configuration
brave:
  search:
    api-key: ${BRAVE_API_KEY:YOUR_API_KEY_HERE}
    base-url: "https://api.search.brave.com"
    timeout: 30s
    max-results: 10
        
# Server configuration
server:
  port: 8080

# Logging configuration
logging:
  level:
    com.coherentsolutions.l09clientmcp: DEBUG
    org.springframework.ai: DEBUG
    # Uncomment to see detailed HTTP requests to OpenAI
    # org.springframework.web.client.RestTemplate: DEBUG