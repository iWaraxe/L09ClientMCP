spring:
  application:
    name: L09ClientMCP
  
  # AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      # Model configuration - you can change this to test different models
      chat:
        options:
          model: gpt-4o-mini  # Alternative: gpt-4o, gpt-4o-mini, gpt-3.5-turbo
          temperature: 0.7
          max-tokens: 1000
    
    # MCP Configuration (Model Context Protocol)
    mcp:
      client:
        enabled: true
        request-timeout: 30s
        type: SYNC  # Use synchronous client for SSE transport
        sse:
          connections:
            echo-server:
              url: "http://localhost:3000/sse"
              enabled: true
              health-check-interval: 30s
              max-retries: 3
              retry-delay: 5s
            brave-search:
              url: "http://localhost:3001/sse"
              enabled: true
              health-check-interval: 30s
              max-retries: 3
              retry-delay: 5s
      
      # Multi-Server Configuration (Branch 9)
      multi-server:
        enabled: true
        load-balancing-strategy: ROUND_ROBIN  # ROUND_ROBIN, WEIGHTED, RANDOM, LEAST_CONNECTIONS
        health-check-interval: 30s
        circuit-breaker:
          failure-threshold: 5
          timeout: 60s
          half-open-retry-delay: 30s
          failure-rate-threshold: 0.5
          half-open-max-calls: 3
        servers:
          mock-server-1:
            url: "mock://server1"
            type: MOCK
            tools: ["echo", "ping"]
            weight: 1
            enabled: true
            connection-timeout: 10s
            description: "Primary mock server for testing"
          mock-server-2:
            url: "mock://server2"
            type: MOCK
            tools: ["echo", "ping"]
            weight: 1
            enabled: true
            connection-timeout: 10s
            description: "Secondary mock server for testing"
          brave-search-server:
            url: "http://localhost:3001/sse"
            type: SSE
            tools: ["brave_web_search", "brave_news_search", "brave_image_search", "brave_video_search"]
            weight: 2
            enabled: true
            connection-timeout: 30s
            description: "Brave Search MCP server"
          weather-server:
            url: "http://localhost:3002/sse"
            type: SSE
            tools: ["get_weather", "get_forecast", "weather_alerts"]
            weight: 1
            enabled: false
            connection-timeout: 15s
            description: "Weather information server"
          calculator-server:
            url: "mock://calculator"
            type: MOCK
            tools: ["calculate", "convert_units", "math_operations"]
            weight: 1
            enabled: false
            connection-timeout: 5s
            description: "Mathematical calculations server"
      
      # Production Configuration (Branch 10)
      production:
        enabled: false  # Set to true to enable production features
        environment: dev  # dev, staging, prod
        
        # Monitoring & Observability
        monitoring:
          enabled: true
          metrics:
            enabled: true
            prometheus: true
            export-interval-seconds: 30
            included-metrics:
              - "mcp.tool.*"
              - "mcp.server.*"
              - "mcp.circuit.*"
              - "mcp.health.*"
              - "mcp.retry.*"
              - "mcp.ratelimit.*"
          health:
            enabled: true
            interval: 30s
            timeout: 5s
            retry-attempts: 3
        
        # Distributed Tracing
        tracing:
          enabled: true
          sampling-rate: 0.1  # 10% sampling for development
          exporter-type: zipkin
          exporter-endpoint: "http://localhost:9411/api/v2/spans"
          baggage-fields:
            - "user.id"
            - "session.id"
            - "request.id"
        
        # Advanced Retry Mechanisms
        retry:
          enabled: true
          default-policy:
            max-attempts: 3
            initial-delay: 100ms
            max-delay: 5s
            multiplier: 2.0
            jitter: 0.1
            retryable-exceptions:
              - "java.net.SocketTimeoutException"
              - "org.springframework.web.client.ResourceAccessException"
              - "java.util.concurrent.TimeoutException"
          tool-policies:
            brave_web_search:
              max-attempts: 2
              initial-delay: 200ms
              max-delay: 3s
              multiplier: 1.5
        
        # Rate Limiting
        rate-limit:
          enabled: true
          global-requests-per-minute: 1000
          server-requests-per-minute: 60
          tool-requests-per-minute: 30
          user-requests-per-minute: 100
          adaptive: true
        
        # Security
        security:
          enabled: true
          auth:
            enabled: true
            type: jwt
            issuer: "mcp-client"
            token-expiration: 1h
            require-https: false  # Set to true in production
          authz:
            enabled: true
            type: rbac
            role-permissions:
              admin: ["*"]
              user: ["tool:invoke", "tool:list", "health:check"]
              readonly: ["tool:list", "health:check"]
        
        # Performance Optimization
        performance:
          cache:
            enabled: true
            type: caffeine
            max-size: 1000
            expire-after-write: 5m
            expire-after-access: 2m
          pool:
            core-pool-size: 10
            max-pool-size: 50
            keep-alive-time: 2m
            queue-capacity: 1000
        
        # Audit Logging
        audit:
          enabled: true
          audit-events:
            - "tool.invocation"
            - "server.selection"
            - "circuit.breaker.event"
            - "security.authentication"
            - "security.authorization"
          destination: file
          retention-period: 90d
        
        # Connection Management
        connection:
          connect-timeout: 10s
          read-timeout: 30s
          write-timeout: 30s
          keep-alive: true
          keep-alive-timeout: 5m
          tls:
            enabled: true
            verify-hostname: true
            protocols: ["TLSv1.2", "TLSv1.3"]

# Brave Search API Configuration
brave:
  search:
    api-key: ${BRAVE_API_KEY:YOUR_API_KEY_HERE}
    base-url: "https://api.search.brave.com"
    timeout: 30s
    max-results: 10
        
# Server configuration
server:
  port: 8080

# Spring Boot Actuator (Production Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,traces,env,beans,conditions"
      base-path: "/actuator"
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
        descriptions: true
    distribution:
      percentiles-histogram:
        mcp.tool.invocation: true
        mcp.server.response: true
        mcp.health.check: true
      percentiles:
        mcp.tool.invocation: 0.5,0.95,0.99
        mcp.server.response: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 0.1
    zipkin:
      endpoint: "http://localhost:9411/api/v2/spans"
  health:
    circuit-breakers:
      enabled: true
    rate-limiters:
      enabled: true

# Logging configuration
logging:
  level:
    com.coherentsolutions.l09clientmcp: DEBUG
    org.springframework.ai: DEBUG
    # Production monitoring
    io.micrometer: INFO
    io.zipkin: INFO
    # Uncomment to see detailed HTTP requests to OpenAI
    # org.springframework.web.client.RestTemplate: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"