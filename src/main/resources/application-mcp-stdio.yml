# Profile for MCP with STDIO transport and Echo Server (Branch 3)
spring:
  ai:
    mcp:
      client:
        enabled: true
        type: STDIO
        request-timeout: 30s
        stdio:
          # Mock Echo Server Configuration
          # This demonstrates the structure for future real MCP servers
          servers:
            echo-server:
              # Mock server - handled internally, no external process
              enabled: true
              description: "Mock echo server for educational demonstrations"
        
# Enhanced logging for MCP development
logging:
  level:
    com.coherentsolutions.l09clientmcp: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.ai.mcp: TRACE  # Detailed MCP protocol logging